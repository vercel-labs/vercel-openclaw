name: Mirror OpenClaw image to VCR

# Interim mechanism: copies OpenClaw's official image from ghcr.io into Vercel
# Container Registry until OpenClaw's release CI pushes to VCR directly
# (see docs/upstream-ci.md). Tracks the stable moving tags only; betas never
# reach `latest`/`slim` upstream, so they never reach VCR either.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit upstream tag to mirror (e.g. 2026.7.1). Default: latest + slim."
        required: false

permissions:
  contents: read

concurrency:
  group: mirror-vcr
  cancel-in-progress: false

env:
  SRC_IMAGE: ghcr.io/openclaw/openclaw
  DST_IMAGE: vcr.vercel.com/openclaw-foundation/openclaw/openclaw

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets present
        env:
          VERCEL_VCR_TOKEN: ${{ secrets.VERCEL_VCR_TOKEN }}
        run: |
          if [ -z "$VERCEL_VCR_TOKEN" ]; then
            echo "::notice::VERCEL_VCR_TOKEN not configured; skipping mirror (expected on forks)."
            echo "SKIP_MIRROR=true" >> "$GITHUB_ENV"
          fi

      - name: Install skopeo
        if: env.SKIP_MIRROR != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: Log in to VCR
        if: env.SKIP_MIRROR != 'true'
        env:
          VERCEL_VCR_TOKEN: ${{ secrets.VERCEL_VCR_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          printf '%s' "$VERCEL_VCR_TOKEN" | skopeo login vcr.vercel.com \
            --username "$VERCEL_TEAM_ID" --password-stdin

      - name: Mirror tags (amd64, digest-checked)
        if: env.SKIP_MIRROR != 'true'
        env:
          EXPLICIT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ARCH_FLAGS="--override-arch amd64 --override-os linux"

          if [ -n "${EXPLICIT_TAG:-}" ]; then
            tags="$EXPLICIT_TAG"
          else
            tags="latest slim"
          fi

          # Idempotency compares LAYER digests, not manifest digests: VCR
          # deterministically rewrites the manifest on push (verified
          # 2026-08-10), so manifest digests never match across registries,
          # while layer blobs are preserved bit-for-bit.
          for tag in $tags; do
            src="docker://$SRC_IMAGE:$tag"
            dst="docker://$DST_IMAGE:$tag"

            src_layers=$(skopeo inspect $ARCH_FLAGS --format '{{.Layers}}' "$src")
            # Guard against a skopeo change rendering {{.Layers}} empty:
            # "" == "" would silently skip every tag forever.
            if [ -z "$src_layers" ]; then
              echo "::error::empty source layer list for $tag (skopeo output changed?)"
              exit 1
            fi
            dst_layers=$(skopeo inspect $ARCH_FLAGS --format '{{.Layers}}' "$dst" 2>/dev/null || echo "absent")

            if [ "$src_layers" = "$dst_layers" ]; then
              echo "$tag: layers match, skipped"
              continue
            fi

            echo "$tag: copying"
            skopeo copy $ARCH_FLAGS --retry-times 3 "$src" "$dst"
          done
